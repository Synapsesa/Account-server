spring:
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${local-db.postgres.host}:${local-db.postgres.port}/${local-db.postgres.name}
      username: ${local-db.postgres.username}
      password: ${local-db.postgres.password}

  jpa:
    properties:
      hibernate:
        format:
            sql: true
        highlight:
            sql: true
        hbm2ddl:
            auto: create
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
  
eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9092
  zookeeper:
    connection:
      string: localhost:2181

eventuate:
  outbox:
    id: 1
  database:
    schema: eventuate
  tram:
    saga:
      participant:
        enabled: true
    messaging:
      enabled: true
      producer:
        enabled: true
        properties:
          max.request.size: 10485760
          auto.create.topics.enable: true
          acks: all
          retries: 5
          enable.idempotence: true
          max.in.flight.requests.per.connection: 5
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
      consumer:
        properties:
          max.poll.records: 100
          max.poll.interval.ms: 300000
          session.timeout.ms: 30000
          heartbeat.interval.ms: 10000
          auto.commit.interval.ms: 100
          partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor
        group-id: accountService
        auto-offset-reset: latest
        enable-auto-commit: true
      destinations:
        accountService:
          destination: accountService
          dlq:
            destination: accountService-dlq
    kafka:
      message:
        serializer: io.eventuate.messaging.kafka.basic.consumer.DefaultKafkaMessageSerializer
        deserializer: io.eventuate.messaging.kafka.basic.consumer.DefaultKafkaMessageDeserializer
      properties:
        security.protocol: PLAINTEXT
    events:
      subscriber:
        enabled: true
        id: accountService
        group-id: accountService

logging:
  level:
    org:
      hibernate:
        type: info
        level: info
